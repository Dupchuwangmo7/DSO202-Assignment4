{{- /*
=============================================================================
File       : charts/tasktracker/templates/backend-deployment.yaml
Assignment : DSO202 Assignment 4
Descriptor : Unit IV 4.3.2 (sync waves), 4.3.3 (health checks)
Purpose    : The backend API. Sync wave 1: created after the database is
             Healthy, before the frontend.
============================================================================= */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-backend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.backend | quote }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  # C6: report a stuck rollout after 2 minutes instead of the 600s default,
  # so Task 7's faulty release becomes Degraded while it is being watched.
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" . | nindent 6 }}
      tier: backend
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        tier: backend
      annotations:
        # A ConfigMap change alone does not change the Pod template, so a
        # rollout would not happen. Hashing the rendered ConfigMap in makes
        # every content change produce a controlled rolling update.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "task-tracker.fullname" . }}-backend
      automountServiceAccountToken: false
      containers:
        - name: backend
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $k := list "DB_HOST" "DB_PORT" "DB_NAME" "APP_PORT" "CORS_ORIGIN" }}
            - name: {{ $k }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" $ }}-config
                  key: {{ $k }}
            {{- end }}
            {{- range $k := list "DB_USER" "DB_PASSWORD" }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $k }}
            {{- end }}
            {{- /* C2: Task 7's fix-forward adds a variable here, in values,
                   with no change to this template. */}}
            {{- range $k, $v := .Values.backend.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # C4: /api/status is the endpoint the application already provides.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
