{{- /*
=============================================================================
File       : charts/tasktracker/templates/serviceaccounts.yaml
Assignment : DSO202 Assignment 4
Descriptor : Unit II - RBAC (workload identity)
Purpose    : One identity per workload. No Role is bound to any of them and no
             API token is mounted, because none of the three containers calls
             the Kubernetes API.
Note       : C8 - the Roles and RoleBindings for human access are NOT rendered
             by this chart. They belong to the platform layer
             (platform/<env>/rbac.yaml), so the dso202 project cannot widen
             its own permissions.
============================================================================= */}}
{{- range $tier := list "frontend" "backend" "db" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "task-tracker.fullname" $ }}-{{ $tier }}
  labels:
    {{- include "task-tracker.labels" $ | nindent 4 }}
    tier: {{ $tier }}
  annotations:
    # Wave -0 equivalent: created with the database wave so every later tier
    # finds its identity already present.
    argocd.argoproj.io/sync-wave: {{ $.Values.syncWaves.database | quote }}
automountServiceAccountToken: false
{{- if ne $tier "db" }}
---
{{- end }}
{{- end }}
