{{- /*
=============================================================================
File       : charts/tasktracker/templates/services.yaml
Assignment : DSO202 Assignment 4
Descriptor : Unit I 1.2.3 - Services; Unit II - headless Services
Purpose    : One Service per tier. The database Service is headless and governs
             the StatefulSet; the backend is ClusterIP only (never reachable
             from outside the cluster); the frontend is a NodePort (C10).
============================================================================= */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-db
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: database
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.database | quote }}
spec:
  # Headless: gives the StatefulSet Pod a stable DNS name (<name>-db-0).
  clusterIP: None
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    tier: database
  ports:
    - name: postgres
      port: {{ .Values.database.service.port }}
      targetPort: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-backend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: backend
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.backend | quote }}
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    tier: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: frontend
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.frontend | quote }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "task-tracker.selectorLabels" . | nindent 4 }}
    tier: frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      {{- if eq .Values.frontend.service.type "NodePort" }}
      # 30080 in dev (mapped by the kind configuration), 30081 in staging
      # (not mapped: staging is reached with kubectl port-forward).
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
