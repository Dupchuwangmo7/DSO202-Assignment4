{{- /*
=============================================================================
File       : charts/tasktracker/templates/frontend-deployment.yaml
Assignment : DSO202 Assignment 4
Descriptor : Unit IV 4.3.2 (sync waves), 4.3.3 (health checks)
Purpose    : The static frontend. Sync wave 2: last, after the backend.
============================================================================= */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "task-tracker.fullname" . }}-frontend
  labels:
    {{- include "task-tracker.labels" . | nindent 4 }}
    tier: frontend
  annotations:
    argocd.argoproj.io/sync-wave: {{ .Values.syncWaves.frontend | quote }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "task-tracker.selectorLabels" . | nindent 6 }}
      tier: frontend
  template:
    metadata:
      labels:
        {{- include "task-tracker.labels" . | nindent 8 }}
        tier: frontend
      annotations:
        # BACKEND_URL is rendered into config.js at container start, so a
        # change to it only takes effect when the Pod restarts.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "task-tracker.fullname" . }}-frontend
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "task-tracker.fullname" . }}-config
                  key: BACKEND_URL
          # C4: nginx serves the page; a 200 on / means the tier is ready.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
