# Chart.yaml - identity and metadata of the chart.
apiVersion: v2                 # chart format for Helm 3 and Helm 4
name: task-tracker
description: Three-tier Task Tracker (nginx frontend, Node.js API, PostgreSQL) for DSO202, delivered by Argo CD
type: application
version: 0.2.0                 # version of the CHART; must increase on any chart change
