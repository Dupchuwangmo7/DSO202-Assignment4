# =============================================================================
# File       : environments/staging/values.yaml
# Assignment : DSO202 Assignment 4
# Descriptor : Unit IV 4.3.1 - Application sources; Unit III 3.2 - Helm values
# Purpose    : Everything that differs from the chart defaults in staging.
#              Staging follows an immutable Git tag and is synchronised by
#              hand: it is the promotion gate between dev and release.
# =============================================================================
environment: staging

images:
  frontend:
    tag: "1.0"
  backend:
    tag: "1.0"
  database:
    tag: "1.0"

# Created in this namespace by the Sealed Secrets controller from
# platform/staging/tasktracker-credentials.sealed.yaml
existingSecret: tasktracker-credentials

frontend:
  replicaCount: 1
  service:
    type: NodePort
    port: 8080
    # NOT mapped by the kind configuration (section 6.3): staging is reached
    # with kubectl port-forward, which is deliberate.
    nodePort: 30081
  # The browser calls this address directly (nginx does not proxy /api).
  # See README, "Browser access": with no ingress controller the backend has
  # no browser-reachable address, so API calls from the page require a
  # port-forward on the matching port.
  backendUrl: "http://localhost:8080"

backend:
  replicaCount: 1
  # v1.1: expose the release label to the backend (see dev values for rationale).
  # Chart change: none — contract C2 passes .Values.backend.extraEnv straight
  # through.
  extraEnv:
    APP_RELEASE: "v1.2.0"

database:
  storageSize: 1Gi
